name: I.G.O.R. public source diagnostics

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: igor-public-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: vars.GASOPS_MONITOR_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Bounded provider diagnostics
        env:
          SOURCES: ${{ vars.GASOPS_MONITOR_SOURCES }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          sources=os.environ.get("SOURCES","").split()
          allowed={"entsog","acer","mase"}
          if not sources or not set(sources)<=allowed:
              sys.exit("Configure authorized keyless sources: entsog acer mase")
          sys.exit(subprocess.call([sys.executable,"-m","gasops_app.monitoring","--diagnostic-only","--confirm-terms","--sources",*sources,"--report","monitor-output/report.json"]))
          PY
      - name: Upload diagnostics only (no raw observations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: igor-monitor-report
          path: monitor-output/report.json
          if-no-files-found: ignore
          retention-days: 30
