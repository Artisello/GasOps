name: I.G.O.R. checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Offline release readiness
        run: python -m gasops_app.readiness
      - name: Record resolved environment (no secrets)
        run: python -m pip list --format=json > resolved-dependencies.json
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies
          path: resolved-dependencies.json
          retention-days: 7
      - name: ENTSOG live smoke test (non-blocking upstream diagnostic)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/entsog-coverage-validation'
        continue-on-error: true
        run: python -m gasops_app.entsog_probe
      - name: ENTSOG network smoke test (non-blocking upstream diagnostic)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/entsog-network-intelligence-step4'
        continue-on-error: true
        run: python -m gasops_app.entsog_network_probe
      - name: ACER TERMINAL CSV smoke test (non-blocking upstream diagnostic)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/acer-market-intelligence-step5'
        continue-on-error: true
        run: python -m gasops_app.acer_probe
