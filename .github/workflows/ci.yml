name: I.G.O.R. checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: ENTSOG live smoke test (non-blocking upstream diagnostic)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/entsog-coverage-validation'
        continue-on-error: true
        run: python -m gasops_app.entsog_probe
      - name: ENTSOG network smoke test (non-blocking upstream diagnostic)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/entsog-network-intelligence-step4'
        continue-on-error: true
        run: python -m gasops_app.entsog_network_probe
