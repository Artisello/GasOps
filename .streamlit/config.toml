[theme]
base = "dark"
primaryColor = "#65dfbf"
backgroundColor = "#0b111b"
secondaryBackgroundColor = "#101925"
textColor = "#f1f5f9"
borderColor = "#2e4054"
showWidgetBorder = true
baseRadius = "0.45rem"
buttonRadius = "0.4rem"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#0b1420"
secondaryBackgroundColor = "#142234"
borderColor = "#2e4054"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
address = "127.0.0.1"
maxUploadSize = 24
