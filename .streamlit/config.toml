[theme]
base = "dark"
primaryColor = "#65dfbf"
backgroundColor = "#0d131d"
secondaryBackgroundColor = "#141e2b"
textColor = "#f1f5f9"
borderColor = "#2e4054"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "0.625rem"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#111a26"
secondaryBackgroundColor = "#1e2b3c"
borderColor = "#2e4054"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
address = "127.0.0.1"
maxUploadSize = 24
