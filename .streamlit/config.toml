[theme]
base = "dark"
primaryColor = "#65dfbf"
backgroundColor = "#0b111b"
secondaryBackgroundColor = "#14202e"
textColor = "#f1f5f9"
borderColor = "#61768c"
showWidgetBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#0e1824"
secondaryBackgroundColor = "#14202e"
borderColor = "#61768c"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
address = "127.0.0.1"
maxUploadSize = 24
